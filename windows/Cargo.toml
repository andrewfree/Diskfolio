[package]
name = "diskfolio-windows"
version = "0.1.0"
edition = "2024"
license = "MIT"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["listbox", "notice"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
] }
